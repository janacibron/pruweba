<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Client Portal — Pruweba</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root { color-scheme: dark; }
  body { background:#08090c; font-family:'Inter',system-ui,sans-serif; }
  .mono { font-family:'IBM Plex Mono',ui-monospace,monospace; }
  .panel { background:#0d0f14; border:1px solid #1c202b; }
  .glow { box-shadow:0 0 0 1px rgba(52,211,153,.15), 0 12px 40px -18px rgba(52,211,153,.4); }
  pre.terminal { font-family:'IBM Plex Mono',monospace; font-size:12.5px; line-height:1.55;
    color:#c8f5e0; background:#06070a; border:1px solid #161a22; white-space:pre; overflow-x:auto; }
  .bar-track { background:#161a22; }
  .bar-fill { background:linear-gradient(90deg,#10b981,#34d399); transition:width .6s cubic-bezier(.4,0,.2,1); }
  .skeleton { background:linear-gradient(90deg,#12151c 25%,#1a1f29 50%,#12151c 75%); background-size:200% 100%; animation:sh 1.4s infinite; }
  @keyframes sh { 0%{background-position:200% 0} 100%{background-position:-200% 0} }
</style>
</head>
<body class="text-slate-200 min-h-screen">

<header class="border-b border-[#1c202b] bg-[#0a0c11]/80 backdrop-blur sticky top-0 z-10">
  <div class="max-w-6xl mx-auto px-6 py-4 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <div class="w-8 h-8 rounded-md bg-emerald-500/15 border border-emerald-500/30 grid place-items-center">
        <span class="text-emerald-400 mono text-sm font-semibold">P</span>
      </div>
      <div>
        <div class="text-sm font-semibold tracking-tight">Pruweba Client Portal</div>
        <div class="mono text-[11px] text-slate-500">governed delivery · merkle-sealed proofs</div>
      </div>
    </div>
    <div class="flex items-center gap-3">
      <div class="text-right hidden sm:block">
        <div class="mono text-[10px] uppercase tracking-widest text-slate-500">Signed in</div>
        <div id="userEmail" class="mono text-xs text-slate-300">—</div>
      </div>
      <button id="signOutBtn" class="mono text-xs px-3 py-2 rounded-md bg-[#0d0f14] border border-[#1c202b] text-slate-400 hover:text-slate-200 hover:border-slate-600">sign out</button>
    </div>
  </div>
</header>

<main class="max-w-6xl mx-auto px-6 py-8 space-y-6">

  <div id="alert" class="hidden rounded-md border px-4 py-3 mono text-xs"></div>

  <section class="panel rounded-xl p-6 glow">
    <div class="flex items-end justify-between mb-4 flex-wrap gap-4">
      <div>
        <div class="mono text-[11px] uppercase tracking-widest text-slate-500">Engagement</div>
        <h1 id="clientName" class="text-2xl font-semibold tracking-tight mt-1">—</h1>
      </div>
      <div class="text-right">
        <div id="pct" class="text-3xl font-semibold mono text-emerald-400">0%</div>
        <div id="counts" class="mono text-[11px] text-slate-500">0 / 0 milestones sealed</div>
      </div>
    </div>
    <div class="bar-track h-2.5 rounded-full overflow-hidden">
      <div id="bar" class="bar-fill h-full rounded-full" style="width:0%"></div>
    </div>
    <div class="mt-4 grid sm:grid-cols-3 gap-3">
      <div class="rounded-lg bg-[#0a0c11] border border-[#1c202b] px-4 py-3">
        <div class="mono text-[10px] uppercase tracking-widest text-slate-500">Status</div>
        <div id="verdict" class="mono text-sm text-slate-200 mt-1">—</div>
      </div>
      <div class="rounded-lg bg-[#0a0c11] border border-[#1c202b] px-4 py-3 sm:col-span-2">
        <div class="mono text-[10px] uppercase tracking-widest text-slate-500">Oracle</div>
        <div id="advice" class="mono text-sm text-slate-300 mt-1">—</div>
      </div>
    </div>
  </section>

  <div class="grid lg:grid-cols-5 gap-6">
    <section class="panel rounded-xl p-6 lg:col-span-3">
      <h2 class="mono text-[11px] uppercase tracking-widest text-slate-500 mb-4">Milestones</h2>
      <ul id="milestones" class="space-y-2">
        <li class="skeleton h-12 rounded-lg"></li>
        <li class="skeleton h-12 rounded-lg"></li>
        <li class="skeleton h-12 rounded-lg"></li>
      </ul>
    </section>

    <section class="panel rounded-xl p-6 lg:col-span-2">
      <h2 class="mono text-[11px] uppercase tracking-widest text-slate-500 mb-4">Sealed proofs</h2>
      <div class="mb-4 rounded-lg bg-[#0a0c11] border border-[#1c202b] px-4 py-3">
        <div class="mono text-[10px] uppercase tracking-widest text-slate-500">Seal root</div>
        <div id="root" class="mono text-[11px] text-emerald-300 break-all mt-1">—</div>
        <div id="chain" class="mono text-[10px] mt-2 text-slate-500">chain: —</div>
      </div>
      <ul id="proofs" class="space-y-2 mono text-[11px]"></ul>
    </section>
  </div>

  <section class="panel rounded-xl p-6">
    <h2 class="mono text-[11px] uppercase tracking-widest text-slate-500 mb-4">Terminal view</h2>
    <pre id="terminal" class="terminal rounded-lg p-4">loading…</pre>
  </section>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="/auth.js"></script>
<script src="/portal.js"></script>
</body>
</html>
